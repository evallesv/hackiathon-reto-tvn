# ==============================================================================
# Fly.io Machines configuration
# Specification: https://fly.io/agent-ready.md
# ==============================================================================

app = "hackiathon-reto-tvn"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  ENVIRONMENT = "production"
  LLM_PROVIDER = "opencode"
  OPENCODE_MODEL = "muse-spark-1.3-contributor-free"
  OPENCODE_BASE_URL = "https://api.opencode.ai/v1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
